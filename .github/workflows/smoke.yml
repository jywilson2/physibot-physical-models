name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  layout:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Repo layout smoke
        run: bash tests/smoke/test_repo_layout.sh

  unit-and-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pytest
        run: pip install pytest
      - name: Unit + integration tests (host, no ROS)
        run: python -m pytest tests/unit tests/integration -q

  # --- Docker Compose smoke (optional) ---
  # Cloud agents / some runners have no Docker daemon or cannot pull ros:humble.
  # Students and CI with Docker should run locally:
  #   docker compose -f docker/compose.yaml build ros2
  #   docker compose -f docker/compose.yaml --profile smoke run --rm smoke
  #   docker compose -f docker/compose.yaml --profile nav2 build ros2_nav2
  # Host layout + pytest (jobs above) remain the required green path.
  # Uncomment when runners can pull ros:humble images reliably:
  # ros2-image:
  #   runs-on: ubuntu-22.04
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: docker compose -f docker/compose.yaml build ros2
  #     - run: docker compose -f docker/compose.yaml --profile smoke run --rm smoke

