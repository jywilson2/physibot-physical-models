<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-label="Nav2 navigate_to_pose behavior tree sketch">
  <title>Nav2 BT sketch (navigate_to_pose)</title>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#1e293b; stroke-width:2; }
      .seq { fill:#eef2ff; stroke:#1e293b; stroke-width:2; }
      .rec { fill:#fff7ed; stroke:#1e293b; stroke-width:2; }
      .t { font-family: DejaVu Sans, Arial, sans-serif; font-size:13px; fill:#0f172a; text-anchor:middle; }
      .s { font-family: DejaVu Sans, Arial, sans-serif; font-size:11px; fill:#475569; text-anchor:middle; }
      .e { stroke:#1e293b; stroke-width:2; fill:none; marker-end:url(#a); }
    </style>
  </defs>
  <rect x="280" y="20" width="220" height="44" class="box" rx="6"/>
  <text x="390" y="46" class="t">NavigateToPose (BT root)</text>

  <path class="e" d="M390 64 L390 96"/>
  <rect x="270" y="96" width="240" height="44" class="seq" rx="6"/>
  <text x="390" y="122" class="t">PipelineSequence</text>

  <path class="e" d="M310 140 L180 180"/>
  <path class="e" d="M390 140 L390 180"/>
  <path class="e" d="M470 140 L600 180"/>

  <rect x="90" y="184" width="180" height="50" class="box" rx="6"/>
  <text x="180" y="206" class="t">ComputePathToPose</text>
  <text x="180" y="224" class="s">global planner</text>

  <rect x="300" y="184" width="180" height="50" class="box" rx="6"/>
  <text x="390" y="206" class="t">FollowPath</text>
  <text x="390" y="224" class="s">controller → cmd_vel</text>

  <rect x="510" y="184" width="180" height="50" class="box" rx="6"/>
  <text x="600" y="206" class="t">GoalReached?</text>
  <text x="600" y="224" class="s">success / fail</text>

  <path class="e" d="M390 234 L390 270"/>
  <rect x="270" y="274" width="240" height="50" class="rec" rx="6"/>
  <text x="390" y="296" class="t">RecoverySubtree</text>
  <text x="390" y="314" class="s">on controller / planner fail</text>

  <path class="e" d="M310 324 L180 364"/>
  <path class="e" d="M390 324 L390 364"/>
  <path class="e" d="M470 324 L600 364"/>

  <rect x="100" y="368" width="160" height="44" class="box" rx="6"/>
  <text x="180" y="394" class="t">ClearCostmap</text>
  <rect x="310" y="368" width="160" height="44" class="box" rx="6"/>
  <text x="390" y="394" class="t">Spin / Wait</text>
  <rect x="520" y="368" width="160" height="44" class="box" rx="6"/>
  <text x="600" y="394" class="t">BackUp</text>

  <text x="390" y="440" class="s">Teaching sketch — exact XML follows Nav2 Humble BT navigator defaults</text>
</svg>
